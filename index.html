<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Kiosk</title>
    <style>
        /* CSS สำหรับจอ Kiosk บน Raspberry Pi */
        
        /* 1. ซ่อนเมาส์แบบเด็ดขาด */
        body {
            cursor: none !important; 
            margin: 0;
            padding: 0;
            background-color: #121212; /* พื้นหลังสีเข้ม สบายตาเวลาเปิดทิ้งไว้ */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* ซ่อนแถบ Scrollbar */
        }

        /* 2. จัดรูปแบบกล่องแสดงสภาพอากาศ (ไม่มีการเรียกใช้ Icon ภายนอก) */
        .weather-container {
            text-align: center;
            background: #1e1e1e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 80%;
            max-width: 600px;
        }

        .location {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4da8da;
        }

        .temperature {
            font-size: 6rem;
            font-weight: bold;
            margin: 20px 0;
        }

        .condition {
            font-size: 2rem;
            color: #cccccc;
            margin-bottom: 30px;
        }

        .details {
            display: flex;
            justify-content: space-around;
            font-size: 1.5rem;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 1rem;
            color: #888;
        }

        .time {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="weather-container">
        <!-- ข้อมูลสภาพอากาศ (แก้ไขเป็นค่าจริงของเว็บคุณได้เลย) -->
        <div class="location">กรุงเทพมหานคร</div>
        <div class="temperature">32°C</div>
        <div class="condition">ท้องฟ้าโปร่ง แดดจัด</div>
        
        <div class="details">
            <div class="detail-item">
                <span class="detail-label">ความชื้น</span>
                <span>65%</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">แรงลม</span>
                <span>12 กม./ชม.</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">โอกาสฝนตก</span>
                <span>10%</span>
            </div>
        </div>

        <!-- เวลาอัปเดต -->
        <div class="time" id="clock">กำลังโหลดเวลา...</div>
    </div>

    <script>
        // สคริปต์สำหรับแสดงเวลาอัปเดตแบบ Real-time บนหน้าจอ
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('th-TH', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            const dateString = now.toLocaleDateString('th-TH', { 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric' 
            });
            document.getElementById('clock').textContent = `ข้อมูลล่าสุด: ${dateString} เวลา ${timeString}`;
        }

        // อัปเดตเวลาทุกๆ 1 วินาที
        setInterval(updateTime, 1000);
        updateTime();

        /* 
        หมายเหตุ: หากคุณมี Script สำหรับดึงข้อมูล API สภาพอากาศ (เช่น OpenWeatherMap หรือ TMD) 
        สามารถนำมาเขียนต่อในส่วนนี้ เพื่อให้ค่าอุณหภูมิด้านบนเปลี่ยนแบบอัตโนมัติได้เลยครับ 
        */
    </script>

</body>
</html>
